<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nav</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <main class="main">
      <header class="main-header">
        <nav class="navbar">
          <input
            type="search"
            class="search-input"
            name="search"
            id="search"
            placeholder="Search Your Course"
          />

          <div class="round"><i class="fa-solid fa-envelope"></i></div>
          <div class="round"><i class="fa-solid fa-chalkboard"></i></div>
          <div class="vertical-line"></div>
          <h4 id="dashboard">Jason Ranti</h4>
        </nav>
      </header>
      <aside id="sd">
          <div class="stat">
            <h4 id="dashbrd">Statistic</h4>
            <i class="fa-solid fa-ellipsis-vertical"></i>
          </div>
          <img class="chart" src="./stat-chart.jpg" alt="">
        </aside>
      <div>
        <img height: 400px;
        width: 600px; src="./hero.png" class="hero-img" alt="" ></div>
         
        <div class="card-box">
            <div class="card"> 
                <i class="fa-solid fa-pen-ruler" id="ruler"></i>           
                <div class="crd-txt-box">
                    <h4 id="dashbrd" style="color: grey;">2/8 watched</h4>
                    <h2 class="crd-txt">
                        UI/UX Design
                    </h2>
                </div> 
            </div>
            <div class="card"> 
                    <i class="fa-solid fa-magnifying-glass-chart" id="ruler"></i>            <div class="card-text">
                <div class="crd-txt-box">
                    <h4 id="dashbrd" style="color: grey;">3/8 watched</h4>
                    <h2 class="crd-txt">
                         Digital Marketing
                    </h2>
                </div> 
            </div>
            <div class="card"> 
                <i class="fa-solid fa-robot" id="ruler"></i>
                <div class="crd-txt-box">
                    <h4 id="dashbrd" style="color: grey;">6/12 watched</h4>
                    <h2 class="crd-txt">
                        Artificial Intelligence
                    </h2>
                </div>   
            </div>
        </div>
      </div>
    
    </main>
  </body>
</html>
