<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-index</title>
    <style>
        .box{
            height: 200px;
            width: 210px;
            border: 1px solid goldenrod;
        }
        #box1{
          background-color: rgb(116, 204, 189);
        }
        #box2{
          background-color: rgb(141, 183, 222);
          
        }
        #box3{
          background-color: rgb(162, 139, 186);
            top: -72px;
            left: 67px;
            position: relative;
            border: 2px solid black;
        }
        #box4{
          background-color: rgb(201, 147, 179);       
        }
        #heart{
            height: 18px;
            width: 18px;
            bottom:-82px;
            left:167px;
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div style="position: relative;">
        
    <div style="height: 200px;width: 210px; background-color: aliceblue;border: 1px solid goldenrod;">

    </div>
    </div>
    <div class="box" id="box1"></div>
    <i class="fa-regular fa-heart" id="heart"></i>
    <div class="box" id="box3"><i class="fa-regular fa-heart" ></i></div>
    <div class="box" id="box4"></div>
</body>
</html>
