<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    
      <section
        style="
          height: 29vh;

          padding-left: 1%;

          display: flex;
          justify-content: center;
          background-color: cadetblue;
          color: rgb(23, 36, 48);
        "
      >
        <h1>
          <img
            src="/Html_Course_Work/images/icons8-graduation-cap-100.png"
            alt="graduation cap"
          />Student Registration Form
        </h1>
      </section>
      <!--Input-->
    <form style="padding: 2%; "></form>  
        <label for="">Full Name</label>
        <input  placeholder="Enter your Full Name" type="text" name="" id="" />
        <br><br>
        <label for="">Email Address</label>
        <input type="email" placeholder="xyz@gmail.com" name="" id=""><br><br>
        <label for="">Password</label>
        <input type="password" placeholder="Enter Password" name="" id="">
        <br><br>
        <label for="Phone" placeholder = "+92123-456789">Phone Number</label>
        <input type="number"/>
        <br><br>
        <label for="D.O.B">Date of Birth</label><br><br>
        <input type="date" name="" id=""><br><br>
        <label for="" >Department</label>
        <select name="Department" id="department" >
            <option value="Department">Select your Department</option>  
            <option value="IT">IT</option>
            <option value="CS">CS</option>
            <option value="SE">SE</option>
            <option value="CYS">CYS</option>
        </select>
        <br><br>
        <label for="Gender">Gender</label><br>
        <section style="padding-left: 2%;">
            <input type="radio" name="Gender" value="male">
            Male
            <input type="radio" name="Gender" value="Female">
            Female
        </section>    
    </form>
  </body>
</html>
